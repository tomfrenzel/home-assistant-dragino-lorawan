name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "21 7 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.homeassistant }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        homeassistant: [pinned, latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # 10.3.3
      - name: Create the matching Home Assistant environment
        run: python scripts/setup_test_environment.py --target "$HA_TARGET"
        env:
          HA_TARGET: ${{ matrix.homeassistant }}
      - run: .venv/bin/python -m pytest tests -q
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy custom_components/dragino --strict --ignore-missing-imports

  hacs:
    name: HACS
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@master

  ci:
    name: CI
    if: always()
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - name: Require all Home Assistant lanes to pass
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.test.result }}
